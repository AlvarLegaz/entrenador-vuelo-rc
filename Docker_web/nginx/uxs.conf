# nginx de UxS Trainer (Docker_web): el simulador web con HTTPS y, detras, el servidor del aula (servicio "aula").
# Es una plantilla: al arrancar, la imagen de nginx cambia ${PUERTO_HTTPS} por su valor (las variables de nginx, en
# minusculas, se quedan como estan).

# los registros de vuelo llegan comprimidos (hasta 10 MB); el resto de la API, JSON de menos de 1 MB
client_max_body_size 12m;
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml application/octet-stream;
server_tokens off;

# el servidor del aula (servicio "aula" de docker-compose.yml); la IP real del alumno va en X-Real-IP (--detras-de-proxy)
upstream aula {
    server aula:8080;
    keepalive 16;
}

# 80: todo a HTTPS, al puerto publicado (PUERTO_HTTPS de .env: lo pone la plantilla al arrancar)
server {
    listen 80;
    listen [::]:80;
    return 301 https://$host:${PUERTO_HTTPS}$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    ssl_certificate     /certs/uxs.crt;
    ssl_certificate_key /certs/uxs.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/uxs/simulador_web;
    index index.html;

    # ---- el aula: la API, el panel del profesor y la vista del alumno (sus propias cabeceras de seguridad) ----
    location /api/ {
        proxy_pass http://aula;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_request_buffering on;              # el aula recibe el cuerpo entero de golpe: un alumno lento no ocupa un hilo
    }
    location = /profesor.html {
        proxy_pass http://aula;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /espectador.html {
        proxy_pass http://aula;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- el simulador web ----
    # la configuracion del despliegue: el aula en esta misma direccion
    location = /config.js {
        alias /etc/nginx/uxs/config.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }
    # el navegador lo pide solo: sin icono, una respuesta vacia (no un 404 en la consola)
    location = /favicon.ico { access_log off; log_not_found off; return 204; }
    # nada de pruebas ni de codigo de los servidores
    location ~ (^|/)(Tests|__pycache__)(/|$) { return 404; }
    location ~ \.(py|pyc|ps1|sh|md)$ { return 404; }
    # los datos comunes (vehiculos, escenarios, entrenamientos, operaciones y zonas): solo datos
    location ~ ^/datos/(.+\.(js|json|jpg|png|bin|txt))$ {
        alias /srv/uxs/datos/$1;
        add_header Cache-Control "no-cache";     # se revalidan (304 si no han cambiado): tras actualizar, los nuevos
        add_header X-Content-Type-Options nosniff;
    }
    location /datos/ { return 404; }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
    }
}

# 8080: el aula sin cifrar, como el servidor del aula de siempre (para el simulador de Godot y las gafas, que no
# aceptan el certificado autofirmado). Si no se usan, quitad el puerto 8080 de docker-compose.yml.
server {
    listen 8080;
    listen [::]:8080;
    location / {
        proxy_pass http://aula;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
